<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔒 怪兽守门</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --color-fur-primary: #FF6B6B;
            --color-fur-secondary: #4ECDC4;
            --color-fur-accent: #FFE66D;
            --shadow-deep: 0 15px 30px rgba(0, 0, 0, 0.2);
            --font-display: 'Fredoka One', cursive;
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Nunito', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .guard-monster {
            font-size: 8rem;
            animation: bounce 2s infinite;
            margin-bottom: 20px;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-20px);
            }
        }

        h1 {
            font-family: var(--font-display);
            font-size: 2.5rem;
            color: white;
            margin: 0 0 10px 0;
            text-shadow: 3px 3px 0px rgba(0, 0, 0, 0.2);
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 30px;
        }

        .login-box {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: var(--shadow-deep);
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1rem;
            font-family: inherit;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: var(--color-fur-primary);
        }

        .login-btn {
            width: 100%;
            background: var(--color-fur-primary);
            border: none;
            border-radius: 15px;
            padding: 15px;
            color: white;
            font-family: var(--font-display);
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 5px 0 #c0392b;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .login-btn:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 #c0392b;
        }

        .error-msg {
            background: #ffe6e6;
            color: #d63031;
            padding: 10px;
            border-radius: 10px;
            margin-top: 15px;
            display: none;
        }

        .error-msg.show {
            display: block;
            animation: shake 0.5s;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-10px);
            }

            75% {
                transform: translateX(10px);
            }
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="guard-monster">🛡️👾</div>
        <h1>怪兽守门中</h1>
        <p class="subtitle">只有主人才能进去喂食！</p>

        <div class="login-box">
            <form id="login-form">
                <div class="input-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" name="username" required autocomplete="username">
                </div>
                <div class="input-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="login-btn">进入喂食！</button>
                <div id="error-msg" class="error-msg">
                    用户名或密码错误！怪兽不认识你！
                </div>
            </form>
        </div>
    </div>

    <script>
        const form = document.getElementById('login-form');
        const errorMsg = document.getElementById('error-msg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.classList.remove('show');

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                if (response.ok) {
                    // Login successful, redirect to home
                    window.location.href = '/';
                } else {
                    // Show error
                    errorMsg.classList.add('show');
                }
            } catch (err) {
                console.error('Login error:', err);
                errorMsg.textContent = '登录失败，请重试！';
                errorMsg.classList.add('show');
            }
        });
    </script>
</body>

</html>
